---
# AddaxAI Connect - Full Infrastructure Playbook
# This playbook sets up a complete production-ready VM

# hosts: all, so --limit picks the target. Without --limit this play would
# reach every server in the inventory at once, which the guard below refuses.
- name: Deploy AddaxAI Connect Infrastructure
  hosts: all
  become: yes

  # pre_tasks, not tasks. A bare `tasks:` block runs AFTER `roles:`, so the
  # banner used to print once the whole deploy was already finished and a
  # guard there would have been useless.
  pre_tasks:
    - name: Refuse to deploy to more than one server unless it was asked for
      # Six production servers sit in this inventory. Forgetting --limit used
      # to be impossible because the play was pinned to one group; now it is
      # one keystroke away, so make it loud instead of silent.
      assert:
        that: ansible_play_hosts | length == 1
        fail_msg: >-
          This run targets {{ ansible_play_hosts | length }} servers
          ({{ ansible_play_hosts | join(', ') }}).
          Add --limit <host> to pick one, or pass -e confirm_multi=true if you
          really mean all of them.
        quiet: true
      when: not (confirm_multi | default(false) | bool)
      run_once: true

    - name: Display deployment information
      debug:
        msg: |
          ========================================
          AddaxAI Connect Deployment
          ========================================
          Target: {{ inventory_hostname }} ({{ ansible_host }})
          User: {{ app_user | default('ubuntu') }}
          Directory: {{ app_directory | default('/opt/addaxai-connect') }}
          Environment: {{ app_environment | default('development') }}
          SSL Enabled: {{ enable_ssl | default(false) }}
          {% if domain_name is defined and domain_name %}Domain: {{ domain_name }}{% endif %}

  roles:
    # Phase 1: Security & Base System
    - role: security
      tags: [security, base]
    - role: docker
      tags: [docker, base]

    # Phase 2: Infrastructure Services
    - role: pure-ftpd
      tags: [pure-ftpd, ftps]
    - role: nginx
      tags: [nginx, web]
    - role: ssl
      tags: [ssl, web]

    # Phase 3: Application Deployment
    - role: dev-tools
      tags: [dev-tools, deploy]
    - role: app-deploy
      tags: [app-deploy, deploy]

    # Phase 4: Security Verification
    - role: security-check
      tags: [security-check, verify]

  post_tasks:
    # ═══════════════════════════════════════════════════════════════
    # SSL Finalization - MUST run in post_tasks after all roles complete
    # ═══════════════════════════════════════════════════════════════
    - name: Finalize SSL configuration
      include_role:
        name: ssl
        tasks_from: finalize
      when: enable_ssl | default(false) and domain_name is defined
      tags: [ssl, web]

    - name: Display completion summary
      debug:
        msg: |

          ========================================
          🎉 Deployment Complete!
          ========================================

          VM Configuration:
          - FTPS Server: ftp://{{ ftps_username | default('cameratrap') }}@{{ ansible_host }}:21
          {% if enable_ssl | default(false) and domain_name is defined -%}
          - Web UI: https://{{ domain_name }}
          - API Endpoint: https://{{ domain_name }}/api
          {% else -%}
          - Web UI: http://{{ ansible_host }}
          - API Endpoint: http://{{ ansible_host }}/api
          {% endif -%}
          - MinIO Console: http://{{ ansible_host }}:9001

          Next Steps:
          1. SSH into VM: ssh {{ app_user | default('ubuntu') }}@{{ ansible_host }}
          2. Check services: docker compose ps
          3. View logs: docker compose logs -f
          4. Start building your application!

          Documentation: See README.md and DEVELOPERS.md
          ========================================
