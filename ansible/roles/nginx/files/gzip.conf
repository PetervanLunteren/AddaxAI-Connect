# Compression for every server block on this host.
#
# Ubuntu's stock nginx.conf sets `gzip on` and then leaves every tuning line
# commented out, so the default `gzip_types text/html` applies and nothing
# else is compressed. That shipped 1.9 MB of uncompressed JavaScript and
# 1.8 MB of uncompressed JSON on the demo server. Measured savings once the
# types are listed: JS 1863 -> 563 kB, the timeline response 1753 -> 143 kB,
# the camera list 58 -> 6 kB.
#
# This lives in conf.d rather than in the site template because nginx.conf
# includes conf.d inside the http block, so one file covers the HTTP and the
# HTTPS server alike. Two copies in the site template would drift.

gzip on;

# Level 5 rather than 6. Above 5 the extra CPU buys under a percent of size
# on JSON and JavaScript, and this box shares two cores with postgres.
gzip_comp_level 5;

# Below a kilobyte the header overhead cancels the saving out.
gzip_min_length 1024;

# Caches and the browser must key on the encoding, not only on the URL.
gzip_vary on;

# text/html is always compressed and cannot be listed here.
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/manifest+json
    image/svg+xml;

# Already-compressed formats are left alone: JPEG, PNG, WebP and the
# thumbnails the API streams gain nothing and cost CPU.
