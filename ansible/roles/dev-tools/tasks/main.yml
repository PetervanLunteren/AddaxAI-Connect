---
# Dev Tools Role - Install development tools and utilities

- name: Install essential development packages
  apt:
    name:
      - git
      - build-essential
      - python3
      - python3-pip
      - python3-venv
      - curl
      - wget
      - unzip
      - jq
    state: present
    update_cache: yes

- name: Install optional development tools
  apt:
    name:
      - vim
      - htop
      - tree
      - ncdu
      - net-tools
    state: present
  when: install_vim | default(true) or install_htop | default(true) or install_tree | default(true)

# Which code to check out. git_version pins a tag (v0.9.0) or a branch (main,
# on a dev server only). Left unset, the newest release tag on the remote wins,
# so a new server never starts from an untested head of main.
- name: Find the newest release tag
  command: git ls-remote --tags --refs --sort=-v:refname {{ git_repo }} 'v*'
  register: newest_release
  changed_when: false
  when:
    - git_repo is defined
    - git_version | default('') | length == 0
  tags: [env-refresh]

- name: Use the pinned version
  set_fact:
    checkout_ref: "{{ git_version }}"
  when:
    - git_repo is defined
    - git_version | default('') | length > 0
  tags: [env-refresh]

# Only plain vX.Y.Z counts as a release. A pre-release tag like v1.0.0-rc1
# sorts above v1.0.0 in git's version sort and must never win.
- name: Use the newest release tag
  set_fact:
    checkout_ref: "{{ newest_release.stdout_lines | map('regex_replace', '^.*refs/tags/', '') | select('match', '^v[0-9]+[.][0-9]+[.][0-9]+$') | first | default('') }}"
  when:
    - git_repo is defined
    - git_version | default('') | length == 0
  tags: [env-refresh]

- name: Refuse to deploy without a release tag
  assert:
    that: checkout_ref | length > 0
    fail_msg: "No vX.Y.Z release tag found at {{ git_repo }}. Tag a release, or set git_version to a branch or commit."
    quiet: true
  when:
    - git_repo is defined
    - git_version | default('') | length == 0
  tags: [env-refresh]

- name: Show which version will be deployed
  debug:
    msg: "Checking out {{ checkout_ref }}{{ '' if git_version | default('') else ' (newest release, set git_version to pin one)' }}"
  when: git_repo is defined
  tags: [env-refresh]

- name: Check if repository already exists
  stat:
    path: "{{ app_directory | default('/opt/addaxai-connect') }}/.git"
  register: repo_exists
  tags: [env-refresh]

- name: Remove existing non-git directory (auto-clean for fresh deployments)
  file:
    path: "{{ app_directory | default('/opt/addaxai-connect') }}"
    state: absent
  when:
    - not repo_exists.stat.exists
    - git_repo is defined

- name: Ensure parent directory exists before clone
  file:
    path: "{{ app_directory | default('/opt/addaxai-connect') | dirname }}"
    state: directory
    mode: '0755'
  when:
    - not repo_exists.stat.exists
    - git_repo is defined

- name: Create app directory with proper ownership before clone
  file:
    path: "{{ app_directory | default('/opt/addaxai-connect') }}"
    state: directory
    owner: "{{ app_user | default('ubuntu') }}"
    group: "{{ app_user | default('ubuntu') }}"
    mode: '0755'
  when:
    - not repo_exists.stat.exists
    - git_repo is defined

- name: Clone AddaxAI Connect repository
  git:
    repo: "{{ git_repo }}"
    dest: "{{ app_directory | default('/opt/addaxai-connect') }}"
    version: "{{ checkout_ref }}"
    force: no
    accept_hostkey: yes
  become_user: "{{ app_user | default('ubuntu') }}"
  when:
    - not repo_exists.stat.exists
    - git_repo is defined

# Top level only, never recurse: data/postgres and data/redis belong to the
# container users, and a recursive chown under a running server breaks both
# (redis MISCONF, postgres permission denied on every new connection).
- name: Fix ownership of repository files before update
  file:
    path: "{{ app_directory | default('/opt/addaxai-connect') }}"
    owner: "{{ app_user | default('ubuntu') }}"
    group: "{{ app_user | default('ubuntu') }}"
  when:
    - repo_exists.stat.exists
    - git_repo is defined

- name: Update AddaxAI Connect repository if it exists
  git:
    repo: "{{ git_repo }}"
    dest: "{{ app_directory | default('/opt/addaxai-connect') }}"
    version: "{{ checkout_ref }}"
    force: yes
    accept_hostkey: yes
    update: yes
  become_user: "{{ app_user | default('ubuntu') }}"
  when:
    - repo_exists.stat.exists
    - git_repo is defined
  tags: [env-refresh]

- name: Set up git safe directory (for root and app user access)
  command: git config --global --add safe.directory "{{ app_directory | default('/opt/addaxai-connect') }}"
  become_user: "{{ app_user | default('ubuntu') }}"
  when: git_repo is defined
  ignore_errors: true

# Top level only, same reason as above.
- name: Ensure app directory ownership is correct
  file:
    path: "{{ app_directory | default('/opt/addaxai-connect') }}"
    owner: "{{ app_user | default('ubuntu') }}"
    group: "{{ app_user | default('ubuntu') }}"
    state: directory
  when: app_directory is defined or true

- name: Display completion message
  debug:
    msg: |

      ========================================
      Development environment setup complete!
      ========================================

      Next steps:
      1. SSH into the VM: ssh {{ app_user | default('ubuntu') }}@{{ ansible_host }}
      2. Navigate to the project: cd {{ app_directory | default('/opt/addaxai-connect') }}
      3. Start building the application!

      Useful commands:
      - docker ps                  # List running containers
      - docker compose up -d       # Start all services
      - docker compose logs -f     # View logs
      - docker compose down        # Stop all services

      The repository is at: {{ app_directory | default('/opt/addaxai-connect') }}

