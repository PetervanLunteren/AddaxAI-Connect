---
# Security Role - Basic firewall and user setup

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install ufw (firewall)
  apt:
    name: ufw
    state: present

- name: Allow SSH through firewall
  ufw:
    rule: allow
    port: "{{ allowed_ssh_port | default('22') }}"
    proto: tcp
  when: enable_firewall | default(true)

- name: Allow HTTP through firewall (for future web access)
  ufw:
    rule: allow
    port: '80'
    proto: tcp
  when: enable_firewall | default(true)

- name: Allow HTTPS through firewall (for future web access)
  ufw:
    rule: allow
    port: '443'
    proto: tcp
  when: enable_firewall | default(true)

- name: Allow FTP through firewall (for camera trap uploads)
  ufw:
    rule: allow
    port: '21'
    proto: tcp
  when: enable_firewall | default(true)

- name: Allow FTPS through firewall (explicit TLS)
  ufw:
    rule: allow
    port: '990'
    proto: tcp
  when: enable_firewall | default(true)

- name: Allow FTP passive mode ports
  ufw:
    rule: allow
    port: "{{ ftps_passive_port_min | default('40000') }}:{{ ftps_passive_port_max | default('50000') }}"
    proto: tcp
  when: enable_firewall | default(true)

- name: Set firewall default policy to deny incoming
  ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: enable_firewall | default(true)

- name: Set firewall default policy to allow outgoing
  ufw:
    state: enabled
    policy: allow
    direction: outgoing
  when: enable_firewall | default(true)

- name: Create application user
  user:
    name: "{{ app_user | default('ubuntu') }}"
    shell: /bin/bash
    create_home: yes
    groups: sudo
    append: yes
    state: present
    password: "{{ app_user_password | default('') | password_hash('sha512') if app_user_password is defined else omit }}"
    update_password: on_create

- name: Add application user to docker group (will be created by docker role)
  user:
    name: "{{ app_user | default('ubuntu') }}"
    groups: docker
    append: yes
  failed_when: false  # Will succeed after docker is installed

- name: Ensure .ssh directory exists for app user
  file:
    path: "/home/{{ app_user | default('ubuntu') }}/.ssh"
    state: directory
    owner: "{{ app_user | default('ubuntu') }}"
    group: "{{ app_user | default('ubuntu') }}"
    mode: '0700'

- name: Check if root authorized_keys exists
  stat:
    path: /root/.ssh/authorized_keys
  register: root_auth_keys

- name: Copy authorized_keys from root to app user
  copy:
    src: /root/.ssh/authorized_keys
    dest: "/home/{{ app_user | default('ubuntu') }}/.ssh/authorized_keys"
    owner: "{{ app_user | default('ubuntu') }}"
    group: "{{ app_user | default('ubuntu') }}"
    mode: '0600'
    remote_src: yes
    force: yes
  when:
    - ansible_user == 'root'
    - root_auth_keys.stat.exists

# ---------------------------------------------------------------------------
# Automatic OS security updates
#
# Ubuntu ships unattended-upgrades, but whether it is installed, enabled and
# limited to security updates differs per cloud image. Set it here so every
# server ends up the same. Never reboot on its own: a reboot at 06:00 drops
# camera uploads and nobody would connect the two.
# ---------------------------------------------------------------------------
- name: Install unattended-upgrades
  apt:
    name: unattended-upgrades
    state: present

- name: Take security updates only, and never reboot on our own
  copy:
    dest: /etc/apt/apt.conf.d/51addaxai-unattended-upgrades
    mode: '0644'
    content: |
      // Managed by ansible (roles/security). Do not edit on the server.
      //
      // #clear first: apt appends to a list instead of replacing it, so
      // without this the distro defaults in 50unattended-upgrades would stay
      // in the list and this file would only add to them.
      #clear Unattended-Upgrade::Allowed-Origins;
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      // Reboot only when a patch actually needs it, which is a kernel or a
      // core library, so roughly once a month. This is not a scheduled
      // reboot: without /var/run/reboot-required nothing happens.
      //
      // 04:30 and not 04:00, because a weekly docker builder prune runs at
      // 04:00 on Sunday. The upgrade itself runs around 06:30, so the reboot
      // lands at the next 04:30, about 22 hours later. Later than ideal, but
      // predictable and in the quietest window: after the 02:00 backup and
      // the 03:00 infra alert, before the 06:00 report wave.
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Run the update check and the upgrade every day
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
    content: |
      // Managed by ansible (roles/security). Do not edit on the server.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Enable the unattended-upgrades service
  systemd:
    name: unattended-upgrades
    enabled: yes
    state: started

- name: Enable the timers that actually trigger the upgrade
  # The service alone installs nothing. These two timers do the work, and a
  # disabled timer would leave the service looking enabled while no update
  # ever runs.
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

# ---------------------------------------------------------------------------
# fail2ban, SSH only
#
# Deliberately no FTPS jail. Every camera signs in with the same account from
# a mobile network, and a carrier shares one address over many devices, so one
# camera with a wrong password could ban a whole site and nobody would see it.
# Pure-FTPd already caps clients per IP and refuses anonymous logins.
# ---------------------------------------------------------------------------
- name: Install fail2ban
  apt:
    name:
      - fail2ban
      # The systemd backend needs this on Ubuntu 22.04. Newer releases keep no
      # /var/log/auth.log at all, so reading the journal is the only option
      # that works on both.
      - python3-systemd
    state: present

- name: Configure the fail2ban SSH jail
  copy:
    dest: /etc/fail2ban/jail.d/addaxai-sshd.conf
    mode: '0644'
    content: |
      # Managed by ansible (roles/security). Do not edit on the server.
      [sshd]
      enabled = true
      backend = systemd
      port = {{ allowed_ssh_port | default('22') }}
      maxretry = 5
      findtime = 10m
      bantime = 1h
  register: fail2ban_jail

- name: Enable fail2ban and pick up the jail
  systemd:
    name: fail2ban
    enabled: yes
    state: "{{ 'restarted' if fail2ban_jail.changed else 'started' }}"

# ---------------------------------------------------------------------------
# SSH hardening
#
# Keys only. Root keeps key access on purpose: ansible connects as root (see
# ansible/inventory.yml), so PermitRootLogin no would lock out every deploy.
#
# The filename starts with 01 for a reason. sshd uses the FIRST value it reads
# for a keyword, and cloud images leave a 50-cloud-init.conf behind that turns
# password login back on. A file sorting after that one would be read but
# ignored, which looks hardened and is not.
# ---------------------------------------------------------------------------
- name: Check that sshd reads drop-in config files
  # Without the Include line a drop-in is never read. Checked before writing
  # it, because the copy would otherwise fail with "Destination directory does
  # not exist", which says nothing about the real cause.
  command: grep -qE '^\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf' /etc/ssh/sshd_config
  register: sshd_include
  changed_when: false
  failed_when: false

- name: Fail clearly when sshd has no Include line
  assert:
    that: sshd_include.rc == 0
    fail_msg: >-
      /etc/ssh/sshd_config has no "Include /etc/ssh/sshd_config.d/*.conf", so a
      drop-in would be ignored and the server would look hardened without being
      it. That is Ubuntu 20.04 or older. Use Ubuntu 22.04 or newer, or add the
      Include line to /etc/ssh/sshd_config by hand first.
    quiet: true

- name: Harden sshd
  copy:
    dest: /etc/ssh/sshd_config.d/01-addaxai-hardening.conf
    mode: '0644'
    content: |
      # Managed by ansible (roles/security). Do not edit on the server.
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      PermitEmptyPasswords no
    validate: /usr/sbin/sshd -t -f %s
  register: sshd_hardening

- name: Reload sshd
  systemd:
    name: ssh
    state: reloaded
  when: sshd_hardening.changed

- name: Read back the configuration sshd actually runs with
  command: sshd -T
  register: sshd_effective
  changed_when: false

- name: Fail if the hardening did not take effect
  # Runs every time, not only after a change, so drift on the server shows up
  # on the next deploy instead of being assumed away.
  assert:
    that:
      - "'passwordauthentication no' in sshd_effective.stdout"
      # sshd -T prints the legacy spelling "without-password" for
      # prohibit-password, so accept either.
      - >-
        'permitrootlogin prohibit-password' in sshd_effective.stdout or
        'permitrootlogin without-password' in sshd_effective.stdout
    fail_msg: >-
      sshd still accepts password logins. Either /etc/ssh/sshd_config has no
      "Include /etc/ssh/sshd_config.d/*.conf" line (Ubuntu 20.04 and older), or
      another drop-in sorts before 01-addaxai-hardening.conf. Fix that before
      trusting this role.
    quiet: true
