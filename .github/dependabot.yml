# Security updates only. No version updates.
#
# `open-pull-requests-limit: 0` switches version updates off for an ecosystem.
# Security updates ignore that limit and keep coming, so a package with a known
# vulnerability still opens a pull request, and a package that is merely old
# does not.
#
# That is deliberate. Between 18 and 20 Aug 2026 the version updater opened
# more than forty pull requests. Every advisory in the repo was closed in that
# time, and by the end the version updates were fixing nothing: the alert count
# was zero while the list kept refilling, because the cap is per directory and
# ten pip directories release five at a time out of years of drift. Reading
# those costs real attention and buys no security.
#
# What is still on, and matters more, lives in the repository settings rather
# than in this file: Dependabot alerts, Dependabot security updates, and secret
# scanning with push protection.
#
# `groups` stays, because some packages cannot move alone and a security update
# that ships half a pair is broken on arrival. Each group says
# `applies-to: security-updates`, since that is the only kind of pull request
# this file now produces. All four were learned the hard way:
#
#   vite / @vitejs     plugin-react 6 declares peer vite ^8, so the plugin on
#                      its own fails npm ci with ERESOLVE.
#   react / react-dom  must be the exact same version, the @types follow them,
#                      and react-leaflet 5 declares peer react ^19.
#   torch stack        torchvision 0.16.0 requires torch==2.1.0 exactly.
#   fastapi chain      fastapi 0.141 needs pydantic >=2.9, fastapi-users 12
#                      pinned python-multipart and email-validator exactly, and
#                      fastapi-users 15 needs bcrypt >=4.1.2 for pwdlib.
#
# To bring version updates back, raise open-pull-requests-limit above 0 and add
# `applies-to: version-updates` copies of the groups below.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /shared
      - /services/api
      - /services/ingestion
      - /services/detection
      - /services/classification-deepfaune
      - /services/classification-speciesnet
      - /services/bulk-upload
      - /services/notifications
      - /services/notifications-email
      - /services/notifications-telegram
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      torch:
        applies-to: security-updates
        patterns:
          - torch
          - torchvision
          - timm
      fastapi:
        applies-to: security-updates
        patterns:
          - fastapi
          - fastapi-users*
          - python-multipart
          - pydantic*
          - email-validator
          - bcrypt
          - passlib
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /services/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      vite:
        applies-to: security-updates
        patterns:
          - vite
          - "@vitejs/*"
      react:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "react-leaflet*"
          - "@react-leaflet/*"
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps
