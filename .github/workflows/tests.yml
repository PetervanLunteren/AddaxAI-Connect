name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # One job per test directory, and not one job running `pytest tests/`.
    #
    # Two separate reasons, both real:
    #
    # 1. Collection. Several services have same-named modules (db_operations,
    #    worker, config) and each test conftest puts its own service on
    #    sys.path. Collecting the whole tree in one process lets the first
    #    import win for all of them, and six ingestion files error out.
    #
    # 2. Dependencies. The services do not agree on every pin: api wants
    #    Pillow 10.2.0 while ingestion and notifications-telegram want 10.1.0.
    #    That is fine in production, where each service is its own image, but
    #    pip cannot resolve them into one environment. A job per directory
    #    mirrors the isolation the images already have.
    #
    # fail-fast is off so one broken service does not hide the rest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: tests/api
            reqs: -r services/api/requirements.txt
          - dir: tests/ingestion
            reqs: -r services/ingestion/requirements.txt
          - dir: tests/notifications
            reqs: -r services/notifications/requirements.txt
          - dir: tests/notifications_email
            reqs: -r services/notifications-email/requirements.txt
          - dir: tests/notifications_telegram
            reqs: -r services/notifications-telegram/requirements.txt
          # Only the shared package itself, no service.
          - dir: tests/shared
            reqs: ""
          # These two import cropper and annotated_image, which need Pillow and
          # nothing else. Their service requirements pull megadetector and
          # torch, over a gigabyte, for 35 tests that never touch a model. Same
          # pin as those services use.
          - dir: tests/detection
            reqs: Pillow==12.3.0
          - dir: tests/classification
            reqs: Pillow==12.3.0
          # The watchdog has no requirements.txt, it pins inline in its
          # Dockerfile. Keep these two in step with that file.
          - dir: tests/tier_watchdog
            reqs: boto3==1.34.0 redis==5.0.1

    name: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Same as every service image (python:3.11-slim), so a version
          # difference can never be why CI and production disagree.
          python-version: '3.11'
          cache: pip

      - name: Install libmagic
        # services/ingestion/validators.py uses python-magic, a binding around
        # the system libmagic that fails to import without it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install dependencies
        # Same order as the service Dockerfiles: the service requirements
        # first, then shared/ on top of them.
        #
        # The order decides the outcome, because these are separate pip
        # commands and the last one wins. shared/pyproject.toml is the single
        # source of truth for the pins it owns, so it has to be installed
        # last, exactly as the images do it.
        #
        # Installing shared first is what let fastapi 0.141 go green here on a
        # combination whose image cannot start: fastapi wants pydantic>=2.9
        # and shared pins 2.5.0, so CI upgraded pydantic to suit fastapi while
        # the image downgraded it to suit shared, and the container died with
        # ImportError on pydantic.main.IncEx.
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.reqs }}" ]; then pip install ${{ matrix.reqs }}; fi
          pip install -e shared/
          pip install -r tests/requirements.txt

      - name: Check the environment is consistent
        # pip resolves within one command only. When a later install breaks an
        # earlier one it prints a bare ERROR line and still exits 0, which is
        # how a broken pin reaches an image. pip check exits non-zero, so the
        # mismatch fails here rather than in production.
        run: pip check

      - name: Run ${{ matrix.dir }}
        run: pytest ${{ matrix.dir }} -q

  frontend:
    runs-on: ubuntu-latest
    name: frontend build

    # The python jobs above say nothing about the frontend, so until this job
    # existed a dependency bump touching only package.json got a green tick
    # from eight pytest runs that never opened it. That is how
    # @vitejs/plugin-react 6 reached review looking fine while its peer range
    # asks for vite 8 and this repo pins vite 5.
    #
    # `npm ci` rather than `npm install`: it installs the lockfile exactly and
    # refuses an unsatisfiable peer range, which is the half of the check that
    # catches that class of bump.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same major as services/frontend/Dockerfile (node:20-alpine), so a
          # version difference can never be why CI and the image disagree.
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Build
        working-directory: services/frontend
        # `npm run build` is `tsc --noEmit && vite build`. The bar is zero type
        # errors, not "no new errors"; vite strips types without checking them,
        # so this is the only thing between a type error and production.
        run: npm run build
